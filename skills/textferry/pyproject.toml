[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "textferry"
version = "0.9.0"
description = "Traceable Chinese research-material conversion and scoped review for script-capable agents."
readme = "SKILL.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = [
  "httpx>=0.27,<1",
  "pymupdf>=1.24,<2",
  "opencc-python-reimplemented>=0.1.7,<2",
  "python-docx>=1.1,<2",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
word = ["pypandoc_binary>=1.17,<2"]
epub = ["pypandoc_binary>=1.17,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pyyaml>=6,<7"]

[project.scripts]
textferry = "textferry.workflow:main"
textferry-engine = "textferry.cli:main"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["textferry*"]

[tool.setuptools.package-data]
textferry = ["config/*.toml", "*.cjs"]

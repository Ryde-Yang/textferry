name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: skills/textferry/uv.lock
      - name: Install formula renderer
        run: |
          npm install --global pnpm@11.25.0
          pnpm --dir skills/textferry/assets/word-math install --frozen-lockfile
      - name: Run offline regression suite
        env:
          NODE_PATH: ${{ github.workspace }}/skills/textferry/assets/word-math/node_modules
        run: uv run --project skills/textferry --python '${{ matrix.python }}' --frozen --group dev --extra word python -m pytest tests -q -p no:cacheprovider
      - name: Build Python distributions
        run: uv build --project skills/textferry
